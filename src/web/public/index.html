<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer of My Dreams - Web Interface</title>
    <style>
        body {
            font-family: 'Monaco', 'Consolas', monospace;
            background: #000;
            color: #0f0;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            margin-bottom: 30px;
        }
        
        .control-panel {
            background: #111;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .control-group {
            background: #222;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
        }
        
        .control-group h3 {
            color: #ff0;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        
        .transport-controls {
            text-align: center;
            margin-bottom: 20px;
        }
        
        button {
            background: #333;
            color: #0f0;
            border: 2px solid #555;
            border-radius: 5px;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #555;
            border-color: #777;
            box-shadow: 0 0 5px #0f0;
        }
        
        button.playing {
            background: #050;
            border-color: #0f0;
            color: #fff;
            box-shadow: 0 0 10px #0f0;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
            background: #333;
        }
        
        .value-display {
            color: #0ff;
            font-weight: bold;
            font-size: 16px;
        }
        
        .status {
            background: #001;
            border: 1px solid #003;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: inline-block;
            margin-right: 20px;
        }
        
        .status-label {
            color: #888;
        }
        
        .status-value {
            color: #0ff;
            font-weight: bold;
        }
        
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .track {
            background: #222;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            text-align: left;
        }
        
        .track.active {
            border-color: #0f0;
            background: #030;
        }
        
        .track.inactive {
            border-color: #800;
            background: #300;
            opacity: 0.6;
        }
        
        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .track-number {
            color: #ff0;
            font-weight: bold;
        }
        
        .track-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .track-control {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .track-control label {
            color: #888;
            font-size: 11px;
        }
        
        .track-control input {
            background: #333;
            border: 1px solid #555;
            color: #0f0;
            border-radius: 3px;
            padding: 3px 5px;
            font-family: inherit;
            font-size: 12px;
        }
        
        .track-control input:focus {
            border-color: #0f0;
            outline: none;
        }
        
        .track-status {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        
        .mute-button {
            background: #500;
            color: #f00;
            border: 1px solid #800;
            border-radius: 3px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .mute-button:hover {
            background: #800;
        }
        
        .mute-button.muted {
            background: #800;
            box-shadow: 0 0 5px #f00;
        }
        
        .active-states {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        .active-state {
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        
        .active-state:hover {
            background: #555;
        }
        
        .active-state.current {
            background: #0a0;
            border-color: #0f0;
            color: #fff;
            box-shadow: 0 0 5px #0f0;
        }
        
        .active-state.updated {
            background: #aa0;
            border-color: #ff0;
            color: #000;
            box-shadow: 0 0 5px #ff0;
            animation: flash 0.5s ease-out;
        }
        
        @keyframes flash {
            0% { box-shadow: 0 0 15px #ff0; }
            100% { box-shadow: 0 0 5px #ff0; }
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .connection-status.connected {
            background: #050;
            border: 1px solid #0f0;
            color: #0f0;
        }
        
        .connection-status.disconnected {
            background: #500;
            border: 1px solid #f00;
            color: #f00;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">Connecting...</div>
    
    <div class="container">
        <h1>Sequencer of My Dreams</h1>
        
        <div class="status">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="playStatus">Stopped</span>
            </div>
            <div class="status-item">
                <span class="status-label">BPM:</span>
                <span class="status-value" id="currentBPM">120</span>
            </div>
            <div class="status-item">
                <span class="status-label">Active State:</span>
                <span class="status-value" id="currentActiveState">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Time Sig:</span>
                <span class="status-value" id="timeSignature">4/4</span>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="transport-controls">
                <button id="playBtn">Play</button>
                <button id="stopBtn">Stop</button>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <h3>Tempo Control</h3>
                    <label for="bpmSlider">BPM</label>
                    <input type="range" id="bpmSlider" min="60" max="200" value="120">
                    <div class="value-display" id="bpmValue">120</div>
                </div>
                
                <div class="control-group">
                    <h3>Active States</h3>
                    <p>Click to switch between track combinations:</p>
                    <div class="active-states" id="activeStates">
                        <!-- Active state buttons will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        
        <div class="control-panel">
            <h3>Tracks</h3>
            <div class="tracks-grid" id="tracksGrid">
                <!-- Tracks will be populated by JavaScript -->
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
