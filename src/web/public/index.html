<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer of My Dreams - Visual Monitor</title>
    <style>
        body {
            font-family: 'Monaco', 'Consolas', monospace;
            background: #fafafa;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 300;
        }
        
        .status-bar {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-group {
            display: flex;
            gap: 30px;
        }
        
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .status-label {
            color: #666;
            font-size: 12px;
            margin-bottom: 2px;
        }
        
        .status-value {
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }
        
        .connection-status {
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
        }
        
        .connection-status.connected {
            background: #e8f5e8;
            border: 1px solid #4caf50;
            color: #2e7d32;
        }
        
        .connection-status.disconnected {
            background: #fde7e7;
            border: 1px solid #f44336;
            color: #c62828;
        }
        
        .tracks-container {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
        }
        
        .track-row {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 3px;
            padding: 15px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: 60px 1fr 200px 150px;
            gap: 20px;
            align-items: center;
            transition: all 0.2s;
        }
        
        .track-row.active {
            border-color: #4caf50;
            background: #f8fff8;
        }
        
        .track-row.inactive {
            border-color: #ffcdd2;
            background: #fff5f5;
            opacity: 0.7;
        }
        
        .track-id {
            color: #666;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }
        
        .track-pattern {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .pattern-info {
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .pattern-visualization {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 3px;
            padding: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            white-space: nowrap;
            overflow-x: auto;
        }
        
        .pattern-beat {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin: 1px;
            text-align: center;
            line-height: 20px;
            border-radius: 2px;
        }
        
        .pattern-beat.hit {
            background: #333;
            color: #fff;
        }
        
        .pattern-beat.empty {
            background: #eee;
            color: #999;
        }
        
        .pattern-beat.current {
            box-shadow: 0 0 8px #666;
            animation: pulse 0.5s ease-in-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .track-notes {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .notes-label {
            color: #666;
            font-size: 12px;
        }
        
        .playing-notes {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 3px;
            padding: 8px;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        
        .note {
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            animation: noteOn 0.1s ease-out;
        }
        
        @keyframes noteOn {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }
        
        .info-line {
            display: flex;
            justify-content: space-between;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            color: #333;
            font-weight: bold;
        }
        
        .beat-indicators {
            color: #999;
            font-size: 10px;
            margin-bottom: 3px;
            text-align: center;
        }
        
        .empty-notes {
            color: #999;
            font-style: italic;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sequencer of My Dreams - Visual Monitor</h1>
        
        <div class="status-bar">
            <div class="status-group">
                <div class="status-item">
                    <span class="status-label">Status</span>
                    <span class="status-value" id="playStatus">Stopped</span>
                </div>
                <div class="status-item">
                    <span class="status-label">BPM</span>
                    <span class="status-value" id="currentBPM">120</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Active State</span>
                    <span class="status-value" id="currentActiveState">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Time Signature</span>
                    <span class="status-value" id="timeSignature">4/4</span>
                </div>
            </div>
            <div class="connection-status" id="connectionStatus">Connecting...</div>
        </div>
        
        <div class="tracks-container">
            <div id="tracksDisplay">
                <!-- Track rows will be populated by JavaScript -->
            </div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="reactiveState.js"></script>
    <script src="app.js"></script>
</body>
</html>
